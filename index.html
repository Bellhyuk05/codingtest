<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의실 예약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg:#f2f4f8; --card:#ffffff; --text:#191f28; --muted:#6b7684; --line:#e5e8eb; --field:#f7f8fa;
    --brand:#5b5bf6; --brand2:#8b5cf6; --brand-soft:#eef0ff;
    --ok:#0f9d58; --okbg:#e7f8ef; --fail:#e5383b; --failbg:#ffeceb;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --r1:#5b5bf6; --r2:#14b8a6; --r3:#f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1117; --card:#181b24; --text:#eef0f4; --muted:#9aa3b2; --line:#2a2f3b; --field:#20242f;
      --brand-soft:#262a4a; --okbg:#10291d; --failbg:#331517;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:Pretendard,system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
         -webkit-font-smoothing:antialiased; }

  .hero { background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%); color:#fff;
          padding:36px 16px 84px; }
  .hero-in { max-width:760px; margin:0 auto; }
  .badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.18);
           padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  .hero h1 { font-size:30px; font-weight:800; letter-spacing:-.5px; margin:14px 0 8px; }
  .hero p { margin:0; opacity:.9; font-size:15px; }
  .rules { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .rules span { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
                padding:6px 12px; border-radius:10px; font-size:13px; }

  main { max-width:760px; margin:-56px auto 0; padding:0 16px 48px; position:relative; }

  .result { border-radius:18px; padding:20px; margin-bottom:16px; display:flex; align-items:center; gap:16px;
            background:var(--card); box-shadow:var(--shadow); border:2px solid transparent; }
  .result .icon { flex:none; width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
                  font-size:26px; font-weight:800; color:#fff; background:var(--muted); }
  .result .big { font-size:26px; font-weight:800; letter-spacing:-.3px; }
  .result small { display:block; font-size:14px; color:var(--muted); margin-top:2px; }
  .result .reason { display:block; font-size:15px; font-weight:700; color:var(--fail); margin-top:6px; }
  .result .reason:empty { display:none; }
  .result.ok { background:var(--okbg); border-color:var(--ok); }
  .result.ok .icon { background:var(--ok); }
  .result.ok .big { color:var(--ok); }
  .result.fail { background:var(--failbg); border-color:var(--fail); animation:shake .35s; }
  .result.fail .icon { background:var(--fail); }
  .result.fail .big { color:var(--fail); }
  .result.loading .big, .result.info .big { font-size:17px; font-weight:700; }
  .result.loading .icon { background:var(--brand); animation:pulse 1.2s infinite; }
  .result.info .icon { background:var(--brand); font-size:22px; }
  @keyframes shake { 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-3px)} }
  @keyframes pulse { 50%{opacity:.45} }

  .tabs { display:flex; gap:6px; background:var(--card); padding:6px; border-radius:16px;
          box-shadow:var(--shadow); margin-bottom:16px; }
  .tabs button { flex:1; margin:0; padding:12px 8px; border-radius:12px; background:transparent;
                 color:var(--muted); font-weight:700; }
  .tabs button.on { background:var(--brand-soft); color:var(--brand); }

  .card { background:var(--card); border-radius:20px; padding:22px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2 { font-size:19px; font-weight:800; margin:0 0 4px; letter-spacing:-.3px; }
  .card .desc { color:var(--muted); font-size:14px; margin:0 0 18px; }
  .panel[hidden] { display:none; }

  .field { margin-bottom:16px; }
  .field > .lab { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:8px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  input { font:inherit; font-size:16px; padding:13px 14px; border:1.5px solid transparent; border-radius:12px;
          background:var(--field); color:var(--text); width:100%; outline:none; transition:border-color .15s, background .15s; }
  input:focus { border-color:var(--brand); background:var(--card); }
  input::placeholder { color:var(--muted); opacity:.7; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font:inherit; font-size:15px; font-weight:600; padding:10px 16px; border-radius:12px; cursor:pointer;
          border:1.5px solid var(--line); background:var(--card); color:var(--text); margin:0; transition:all .15s; }
  .chip:hover { border-color:var(--brand); }
  .chip.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .chips.small .chip { padding:7px 12px; font-size:14px; }
  .day-wrap { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .day-wrap input { width:84px; text-align:center; }

  button { font:inherit; font-size:16px; font-weight:700; border:0; cursor:pointer; color:#fff; }
  .submit { width:100%; margin-top:6px; padding:15px; border-radius:14px;
            background:linear-gradient(135deg,var(--brand),var(--brand2)); box-shadow:0 6px 16px rgba(91,91,246,.3);
            transition:transform .1s, opacity .15s; }
  .submit:active { transform:scale(.98); }
  .submit.danger { background:var(--fail); box-shadow:0 6px 16px rgba(229,56,59,.25); }
  .submit:disabled { opacity:.45; cursor:wait; box-shadow:none; }

  .timeline { position:relative; margin:18px 0 6px; }
  .track { position:relative; height:56px; background:var(--field); border-radius:12px; overflow:hidden;
           background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px),var(--line) calc(100%/12)); }
  .block { position:absolute; top:6px; bottom:6px; border-radius:9px; color:#fff; padding:4px 8px; overflow:hidden;
           font-size:12px; font-weight:700; line-height:1.3; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .block span { display:block; font-weight:500; opacity:.9; }
  .hours { position:relative; height:18px; margin-top:6px; font-size:11px; color:var(--muted); }
  .hours span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .hours span:first-child { transform:none; }
  .hours span:last-child { transform:translateX(-100%); }

  .list { list-style:none; margin:14px 0 0; padding:0; }
  .list li { display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; padding:14px 4px; border-top:1px solid var(--line); }
  .row-cancel { display:flex; gap:8px; margin-left:auto; flex:1 1 220px; max-width:280px; }
  .row-cancel input { padding:9px 12px; font-size:15px; }
  .row-cancel button { flex:none; padding:9px 14px; border-radius:10px; background:var(--fail); font-size:15px; }
  @media (max-width:480px) { .row-cancel { max-width:none; margin-left:0; } }
  .list li:first-child { border-top:0; }
  .list .time { font-weight:800; font-size:16px; min-width:124px; font-variant-numeric:tabular-nums; }
  .list .who { display:flex; align-items:center; gap:10px; font-weight:600; }
  .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:13px; font-weight:800; }
  .empty { text-align:center; color:var(--muted); padding:24px 0 8px; }
  .empty b { display:block; font-size:28px; margin-bottom:6px; }

  .foot { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
          color:var(--muted); font-size:13px; padding:4px 4px 0; }
  .link { background:none; color:var(--muted); font-weight:500; font-size:13px; text-decoration:underline; padding:0; }

  @media (max-width:480px) {
    .hero h1 { font-size:25px; }
    .card { padding:18px; }
    .result .big { font-size:22px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <span class="badge">🏫 캠퍼스 강의실</span>
    <h1>강의실 예약</h1>
    <p>원하는 강의실과 시간을 골라 바로 예약하세요.</p>
    <div class="rules">
      <span>🕘 09:00 ~ 21:00</span><span>⏱ 1회 최대 3시간</span><span>👤 1인 하루 2건</span>
    </div>
  </div>
</header>

<main>
  <div class="result loading" id="result">
    <div class="icon">…</div>
    <div><div class="big">불러오는 중…</div><small>처음엔 10초쯤 걸릴 수 있어요</small></div>
  </div>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="book" class="on">📅 예약</button>
    <button type="button" data-tab="cancel">↩️ 취소</button>
    <button type="button" data-tab="view">🗓 시간표</button>
  </nav>

  <section class="card panel" data-panel="book">
    <h2>예약하기</h2>
    <p class="desc">강의실 · 요일 · 시간 · 이름을 입력하세요.</p>
    <form id="bookForm">
      <div class="field"><span class="lab">강의실</span>
        <div class="day-wrap"><div class="chips room-chips"></div>
          <input name="room" placeholder="직접" autocapitalize="characters" autocomplete="off" required aria-label="강의실 직접 입력"></div></div>
      <div class="field"><span class="lab">요일</span>
        <div class="day-wrap"><div class="chips day-chips" data-for="day"></div>
          <input name="day" placeholder="직접" required aria-label="요일 직접 입력"></div></div>
      <div class="field row">
        <label><span class="lab">시작 시각 (24시간)</span><input name="start" inputmode="decimal" placeholder="예: 14 → 14:00" required></label>
        <label><span class="lab">끝 시각 (24시간)</span><input name="end" inputmode="decimal" placeholder="예: 16 → 16:00" required></label>
      </div>
      <div class="field"><label><span class="lab">이름</span><input name="name" placeholder="예약자 이름" required></label></div>
      <button type="submit" class="submit" disabled>예약하기</button>
    </form>
  </section>

  <section class="card panel" data-panel="cancel" hidden>
    <h2>취소하기</h2>
    <p class="desc">본인 이름으로 한 예약만 취소할 수 있어요.</p>
    <form id="cancelForm">
      <div class="field"><span class="lab">강의실</span>
        <div class="day-wrap"><div class="chips room-chips"></div>
          <input name="room" placeholder="직접" autocapitalize="characters" autocomplete="off" required aria-label="강의실 직접 입력"></div></div>
      <div class="field"><span class="lab">요일</span>
        <div class="day-wrap"><div class="chips day-chips" data-for="day"></div>
          <input name="day" placeholder="직접" required aria-label="요일 직접 입력"></div></div>
      <div class="field row">
        <label><span class="lab">시작 시각 (24시간)</span><input name="start" inputmode="decimal" placeholder="예: 14 → 14:00" required></label>
        <label><span class="lab">이름</span><input name="name" placeholder="예약자 이름" required></label>
      </div>
      <button type="submit" class="submit danger" disabled>예약 취소</button>
    </form>
  </section>

  <section class="card panel" data-panel="view" hidden>
    <h2 id="viewTitle">시간표</h2>
    <p class="desc">시작 시각이 빠른 순서로 보여드려요.</p>
    <div class="field"><div class="chips small" id="viewRoomChips"></div></div>
    <div class="field"><div class="chips small" id="viewDayChips"></div></div>
    <div class="timeline"><div class="track" id="track"></div><div class="hours" id="hours"></div></div>
    <div id="schedule"></div>
  </section>

  <div class="foot">
    <span>예약 규칙은 solution.py가 판단합니다</span>
    <button class="link" id="resetBtn" type="button">모든 예약 초기화</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const ROOMS = ["A101", "A102", "B201"];
const DAYS = ["월", "화", "수", "목", "금"];
const ROOM_COLOR = { A101: "var(--r1)", A102: "var(--r2)", B201: "var(--r3)" };
const LOG_KEY = "roomBookingLog";

// 화면 입력값을 숫자로 바꿔 넘길 뿐, 맞는지 틀린지는 solution.py가 정한다
const GLUE = `
from solution import RoomBooking

def to_number(text):
    text = (text or "").strip()
    # 화면에 보이는 "14:00", "14시" 모양으로 입력해도 숫자로 읽는다 ("14:30"은 14.5)
    if text.endswith("시"):
        text = text[:-1].strip()
    hour, colon, minute = text.partition(":")
    if colon and hour.strip().isdigit() and len(minute.strip()) == 2 and minute.strip().isdigit():
        hour, minute = int(hour), int(minute)
        return hour if minute == 0 else hour + minute / 60
    for cast in (int, float):
        try:
            return cast(text)
        except ValueError:
            pass
    return text

rb = RoomBooking()

def do_book(room, day, start, end, name):
    return rb.book(room.strip(), day.strip(), to_number(start), to_number(end), name.strip())

def do_cancel(room, day, start, name):
    return rb.cancel(room.strip(), day.strip(), to_number(start), name.strip())

def do_reason():
    return getattr(rb, "last_reason", "")

def do_schedule(room, day):
    return [list(b) for b in rb.get_schedule(room, day)]
`;

let py, api;
const $ = (s) => document.querySelector(s);
const view = { room: ROOMS[0], day: DAYS[0] };

// 24시간제 표시: 14 → "14:00", 9 → "09:00" (정수가 아니면 입력한 그대로)
function hhmm(h) {
  const t = String(h).trim().replace(/\s*시$/, "");
  if (/^\d{1,2}$/.test(t)) return t.padStart(2, "0") + ":00";
  if (/^\d{1,2}:\d{2}$/.test(t)) return t.padStart(5, "0");
  return t + "시";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 탭
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach((p) => (p.hidden = p.dataset.panel !== name));
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));

// 칩: 누르면 옆의 입력칸 값을 채운다
function makeChips(box, values, onPick) {
  box.innerHTML = values.map((v) => `<button type="button" class="chip" data-v="${v}">${v}</button>`).join("");
  box.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip) onPick(chip.dataset.v);
  });
}
function markChips(box, value) {
  box.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.dataset.v === value));
}

for (const form of [$("#bookForm"), $("#cancelForm")]) {
  const roomBox = form.querySelector(".room-chips"), roomIn = form.elements.room;
  const dayBox = form.querySelector(".day-chips"), dayIn = form.elements.day;
  makeChips(roomBox, ROOMS, (v) => { roomIn.value = v; markChips(roomBox, v); });
  roomIn.addEventListener("input", () => markChips(roomBox, roomIn.value.trim()));
  makeChips(dayBox, DAYS, (v) => { dayIn.value = v; markChips(dayBox, v); });
  dayIn.addEventListener("input", () => markChips(dayBox, dayIn.value.trim()));
  form.syncChips = () => { markChips(roomBox, roomIn.value.trim()); markChips(dayBox, dayIn.value.trim()); };
}

makeChips($("#viewRoomChips"), ROOMS, (v) => { view.room = v; renderSchedule(); });
makeChips($("#viewDayChips"), DAYS.map((d) => d + "요일"), (v) => { view.day = v[0]; renderSchedule(); });
$("#hours").innerHTML = [9, 12, 15, 18, 21].map((h) => `<span style="left:${(h - 9) / 12 * 100}%">${hhmm(h)}</span>`).join("");

function readLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch { return []; }
}
function writeLog(log) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch {}
}

function showResult(state, title, msg, reason = "") {
  const el = $("#result");
  el.className = "result";
  void el.offsetWidth; // 연속 실패에도 흔들림 애니메이션이 다시 나오게
  el.className = "result " + state;
  const icon = { ok: "✓", fail: "✕", info: "👋" }[state] || "…";
  el.innerHTML = `<div class="icon">${icon}</div><div><div class="big"></div><small></small><span class="reason"></span></div>`;
  el.querySelector(".big").textContent = title;
  el.querySelector("small").textContent = msg;
  el.querySelector(".reason").textContent = reason ? "사유: " + reason : "";
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderSchedule() {
  markChips($("#viewRoomChips"), view.room);
  markChips($("#viewDayChips"), view.day + "요일");
  $("#viewTitle").textContent = `${view.room} · ${view.day}요일 시간표`;
  if (!api) return;
  const proxy = api.do_schedule(view.room, view.day);
  const rows = proxy.toJs();
  proxy.destroy();
  const color = ROOM_COLOR[view.room];
  $("#track").innerHTML = rows.map(([s, e, n]) =>
    `<div class="block" style="left:calc(${(s - 9) / 12 * 100}% + 2px);width:calc(${(e - s) / 12 * 100}% - 4px);background:${color}">${esc(n)}<span>${hhmm(s)}~${hhmm(e)}</span></div>`
  ).join("");
  $("#schedule").innerHTML = rows.length
    ? '<ul class="list">' + rows.map(([s, e, n]) =>
        `<li><span class="time">${hhmm(s)} ~ ${hhmm(e)}</span><span class="who"><span class="avatar" style="background:${color}">${esc(String(n).slice(0, 1))}</span>${esc(n)}</span>` +
        `<form class="row-cancel" data-start="${s}"><input name="name" placeholder="예약자 이름" aria-label="${hhmm(s)} 예약 취소할 이름" required><button type="submit">취소</button></form></li>`
      ).join("") + "</ul>"
    : '<div class="empty"><b>🌿</b>예약이 없습니다.</div>';
}

function showSchedule(room, day) {
  if (ROOMS.includes(room.trim())) view.room = room.trim();
  if (DAYS.includes(day.trim())) view.day = day.trim();
  renderSchedule();
}

$("#bookForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  const ok = api.do_book(f.room, f.day, f.start, f.end, f.name);
  if (ok) writeLog([...readLog(), ["book", f.room, f.day, f.start, f.end, f.name]]);
  const msg = `${f.name} · ${f.room} · ${f.day} · ${hhmm(f.start)}~${hhmm(f.end)} 예약`;
  showResult(ok ? "ok" : "fail", ok ? "성공" : "실패", msg + (ok ? " 완료" : "이 거절되었습니다"), ok ? "" : api.do_reason());
  showSchedule(f.room, f.day);
});

function doCancel(room, day, start, name) {
  const ok = api.do_cancel(room, day, start, name);
  if (ok) writeLog([...readLog(), ["cancel", room, day, start, name]]);
  const msg = `${name} · ${room} · ${day} · ${hhmm(start)} 예약 취소`;
  showResult(ok ? "ok" : "fail", ok ? "성공" : "실패", msg + (ok ? " 완료" : "가 거절되었습니다"), ok ? "" : api.do_reason());
  showSchedule(room, day);
}

$("#cancelForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  doCancel(f.room, f.day, f.start, f.name);
});

// 시간표의 각 예약 줄에서 이름만 적고 바로 취소
$("#schedule").addEventListener("submit", (ev) => {
  const form = ev.target.closest(".row-cancel");
  if (!form) return;
  ev.preventDefault();
  doCancel(view.room, view.day, form.dataset.start, form.elements.name.value);
});

$("#resetBtn").addEventListener("click", () => {
  if (!confirm("모든 예약을 지우고 처음 상태로 돌아갈까요?")) return;
  writeLog([]);
  py.runPython("rb = RoomBooking()");
  showResult("info", "초기화했습니다", "예약이 없는 처음 상태입니다.");
  renderSchedule();
});

async function start() {
  try {
    py = await loadPyodide();
    const res = await fetch("solution.py?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("solution.py를 찾지 못했습니다 (" + res.status + ")");
    py.FS.writeFile("solution.py", await res.text());
    py.runPython(GLUE);
    api = { do_book: py.globals.get("do_book"), do_cancel: py.globals.get("do_cancel"),
            do_schedule: py.globals.get("do_schedule"), do_reason: py.globals.get("do_reason") };
    // 새로고침해도 예약이 남도록, 저장해 둔 기록을 solution.py에 다시 실행한다
    for (const [op, ...args] of readLog()) (op === "book" ? api.do_book : api.do_cancel)(...args);
    document.querySelectorAll("button[type=submit]").forEach((b) => (b.disabled = false));
    showResult("info", "준비 완료!", "예약을 시작하세요.");
    renderSchedule();
  } catch (e) {
    showResult("fail", "불러오기 실패", String(e));
  }
}
renderSchedule();
start();
</script>
</body>
</html>
